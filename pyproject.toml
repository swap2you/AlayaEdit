[project]
name = "alayaedit"
version = "0.1.0"
description = "AlayaEdit brings any media in, works it short or long, transcribes it, and plans what goes out."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "aiofiles>=25.1.0",
    "faster-whisper>=1.2.1",
    "nvidia-cublas-cu12>=12.9.2.10",
    "pillow>=12.3.0",
    "playwright>=1.63.0",
    "pyyaml>=6.0.3",
    "rich>=15.0.0",
    "yt-dlp>=2026.8.19",
]

[project.scripts]
alaya-download = "downloader.cli:main"
alaya-upload = "uploader.cli:main"
alaya-lecture = "lectures.cli:main"
alaya-munch = "downloader.munch_cli:main"
media-download = "downloader.cli:main"
media-upload = "uploader.cli:main"
media-lecture = "lectures.cli:main"
media-munch = "downloader.munch_cli:main"
alaya-katha = "katha_video.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["alayaedit", "downloader", "uploader", "shared", "youtube", "lectures", "katha_video"]
